name: Naming Convention

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate naming
        uses: actions/github-script@v7
        with:
          script: |
            // 허용 태그 (.claude/rules/git-conventions.md 와 동기화)
            const tags = ['feat','fix','refactor','style','docs','chore','perf','ci','revert'];
            const t = `(${tags.join('|')})`;
            const issueTitleRe = new RegExp(`^${t}:\\s.+`);          // feat: 설명
            const prTitleRe   = new RegExp(`^\\[#\\d+\\];\\s${t}:\\s.+`); // [#12]; feat: 설명
            const branchRe    = new RegExp(`^${t}/\\d+$`);            // feat/12

            const fail = [];

            if (context.eventName === 'issues') {
              const title = context.payload.issue.title || '';
              if (!issueTitleRe.test(title)) {
                fail.push(`이슈 제목 형식 오류: \`${title}\`\n올바른 형식: \`<tag>: <설명>\` (예: \`feat: 세션 목록 화면 추가\`)`);
              }
            }

            if (context.eventName === 'pull_request') {
              const title = context.payload.pull_request.title || '';
              const branch = context.payload.pull_request.head.ref || '';
              if (!prTitleRe.test(title)) {
                fail.push(`PR 제목 형식 오류: \`${title}\`\n올바른 형식: \`[#이슈번호]; <tag>: <설명>\` (예: \`[#12]; feat: 세션 목록 화면\`)`);
              }
              // main/develop 은 브랜치명 검증 예외 (릴리스/기본 브랜치)
              if (!['main','develop'].includes(branch) && !branchRe.test(branch)) {
                fail.push(`브랜치명 형식 오류: \`${branch}\`\n올바른 형식: \`<tag>/<이슈번호>\` (예: \`feat/12\`)`);
              }
            }

            if (fail.length) {
              const body = `❌ **네이밍 컨벤션 위반**\n\n${fail.map(f => `- ${f}`).join('\n\n')}\n\n> 규칙: \`.claude/rules/git-conventions.md\``;
              const num = context.eventName === 'issues'
                ? context.payload.issue.number
                : context.payload.pull_request.number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: num, body,
              });
              core.setFailed(fail.join(' | '));
            } else {
              core.info('네이밍 컨벤션 통과 ✅');
            }
