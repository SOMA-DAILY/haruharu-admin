name: Deploy

# dev: develop 머지(push) 시 자동 배포.
# prod: Actions에서 수동 실행(Run workflow) — environment=prod 선택.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [prod, dev]
        default: prod

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: true

permissions:
  id-token: write # OIDC 로 AWS 역할 assume
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # push=dev, 수동실행=선택 환경. 환경별 변수(버킷·배포ID·API주소)가 여기서 결정됨.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 환경별 어드민 API 절대주소 (dev: dev-api / prod: api)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
