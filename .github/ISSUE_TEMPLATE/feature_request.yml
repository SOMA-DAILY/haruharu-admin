name: ✨ 기능 요청
description: 새로운 화면/기능을 제안해주세요.
title: "feat: "
labels: ["feature"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: "✨ 기능/화면 설명"
      description: "어떤 화면 또는 기능인지 간결하게 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📌 배경 및 목적"
      description: "왜 필요한가요? 어떤 운영 문제를 해결하나요?"
    validations:
      required: true

  - type: input
    id: mockup
    attributes:
      label: "🖼️ 대응 목업"
      placeholder: "admin-xxx-mockup.html"

  - type: textarea
    id: api_spec
    attributes:
      label: "🔌 연동 API (명세 기준)"
      placeholder: |
        GET /api/v1/admin/...
        (노션: 어드민 API 명세 프런트 연동용)

  - type: textarea
    id: tasks
    attributes:
      label: "📝 작업 내용"
      placeholder: |
        - [ ]
        - [ ]

  - type: textarea
    id: notes
    attributes:
      label: "💬 특이사항 (선택)"
      description: "제약, nullable 필드, 후속 대기 항목 등"
